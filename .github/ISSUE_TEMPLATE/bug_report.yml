name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the problem
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce
      placeholder: |
        1. Run ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Paste error output and relevant logs
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Moon version
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. macOS 15 arm64
    validations:
      required: true
