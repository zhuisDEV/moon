name: Feature request
description: Propose an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or trade-offs
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact and risks
      description: Backward compatibility, migration, operational impact
    validations:
      required: false
