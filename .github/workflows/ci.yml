name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-plan:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed="$(git diff --name-only --no-renames "${GITHUB_SHA}^1" "$GITHUB_SHA" -- \
              .github .cargo Cargo.toml Cargo.lock build.rs assets SKILL.md RELEASE.md \
              docs/updating.md docs/release-signing.md examples/moon-release.rs \
              src/release.rs src/update.rs tests/cli_update.rs \
              tools/interactive-zsh-smoke.zsh tools/recover-openclaw-update.sh)"
            if [[ -z "$changed" ]]; then
              full=false
            fi
          fi
          if [[ "$full" == true ]]; then
            targets='["aarch64-apple-darwin","x86_64-apple-darwin","aarch64-unknown-linux-gnu"]'
          else
            targets='["aarch64-apple-darwin"]'
          fi
          printf 'full=%s\ntargets=%s\n' "$full" "$targets" >> "$GITHUB_OUTPUT"

  linux-x64:
    uses: ./.github/workflows/native-build.yml
    with:
      commit: ${{ github.sha }}
      target: x86_64-unknown-linux-gnu
      package: true

  native-platforms:
    needs: platform-plan
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.platform-plan.outputs.targets) }}
    uses: ./.github/workflows/native-build.yml
    with:
      commit: ${{ github.sha }}
      target: ${{ matrix.target }}
      package: ${{ needs.platform-plan.outputs.full == 'true' }}

  release-manifest:
    needs: [platform-plan, linux-x64, native-platforms]
    if: needs.platform-plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unsigned-release-*
          path: target/release-check
      - name: Restrict release staging to the runner owner
        run: chmod 700 target/release-check
      - name: Assemble four-platform canonical unsigned release manifest
        run: >-
          cargo run --locked --example moon-release -- manifest
          --asset target/release-check/unsigned-release-aarch64-apple-darwin/release-asset.json
          --asset target/release-check/unsigned-release-x86_64-apple-darwin/release-asset.json
          --asset target/release-check/unsigned-release-aarch64-unknown-linux-gnu/release-asset.json
          --asset target/release-check/unsigned-release-x86_64-unknown-linux-gnu/release-asset.json
          --published-at 2026-01-01T00:00:00Z
          --output target/release-check/release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-manifest
          path: target/release-check/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  adapter-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check assets/openclaw-plugin tools docs README.md RELEASE.md SKILL.md CHANGELOG.md
      - run: deno lint assets/openclaw-plugin tools
      - name: Test native Codex route diagnostic without accessing auth or models
        run: deno test --no-config tools/probe-codex-route.test.ts
      - name: Test scheduled learning health reports
        run: deno test --no-config --no-remote tools/check-openclaw-moon.test.ts
      - name: Test source-learning canary contracts without auth or inference
        run: deno test --no-config --no-remote tools/source-learning-canary.test.ts

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: audit-tool
        with:
          path: ${{ runner.temp }}/cargo-audit/bin/cargo-audit
          key: cargo-audit-0.22.2-ubuntu-24.04-${{ runner.arch }}
      - name: Install Cargo Audit
        if: steps.audit-tool.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$RUNNER_TEMP/cargo-audit" cargo-audit --version 0.22.2
      - name: Audit locked dependencies against fresh RustSec advisories
        run: PATH="$RUNNER_TEMP/cargo-audit/bin:$PATH" cargo audit --file Cargo.lock

  gate:
    name: CI Gate
    if: always()
    needs: [platform-plan, linux-x64, native-platforms, release-manifest, adapter-checks, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks to pass
        shell: bash
        env:
          FULL_MATRIX: ${{ needs.platform-plan.outputs.full }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOB_RESULTS"
          jq -e --arg full "$FULL_MATRIX" '
            ($full == "true" or $full == "false")
            and (to_entries | map(select(.key != "release-manifest")) | all(.value.result == "success"))
            and (.["release-manifest"].result == (if $full == "true" then "success" else "skipped" end))
          ' <<< "$JOB_RESULTS" >/dev/null
