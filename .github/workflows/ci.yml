name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            minimum_os_version: "13.0"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            minimum_os_version: "13.0"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            minimum_os_version: "glibc-2.35"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            minimum_os_version: "glibc-2.35"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify native release target
        run: >-
          rustc -vV | grep -F "host: ${{ matrix.target }}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Remove release artifacts restored from an older runner image
        run: cargo clean --release
      - run: cargo build --locked --release
      - name: Exercise documented interactive-zsh strict-mode semantics
        if: matrix.target == 'aarch64-apple-darwin'
        run: >-
          zsh -f -i -c 'source tools/interactive-zsh-smoke.zsh' 2>&1 |
          grep -Fx 'UPDATE SUCCEEDED'
      - name: Generate deterministic unsigned release bundle
        run: >-
          cargo run --locked --example moon-release -- bundle
          --binary target/release/moon
          --minimum-os-version "${{ matrix.minimum_os_version }}"
          --database-schema-min 6
          --database-schema-max 7
          --output-dir "target/release-check/${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-${{ matrix.target }}
          path: target/release-check/${{ matrix.target }}
          if-no-files-found: error

  release-manifest:
    needs: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: unsigned-release-*
          path: target/release-check
          merge-multiple: false
      - name: Restrict release staging to the runner owner
        run: chmod 700 target/release-check
      - name: Assemble four-platform canonical unsigned release manifest
        run: >-
          cargo run --locked --example moon-release -- manifest
          --asset target/release-check/unsigned-release-aarch64-apple-darwin/release-asset.json
          --asset target/release-check/unsigned-release-x86_64-apple-darwin/release-asset.json
          --asset target/release-check/unsigned-release-aarch64-unknown-linux-gnu/release-asset.json
          --asset target/release-check/unsigned-release-x86_64-unknown-linux-gnu/release-asset.json
          --published-at 2026-01-01T00:00:00Z
          --output target/release-check/release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-manifest
          path: target/release-check/release-manifest.json
          if-no-files-found: error

  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check assets/openclaw-plugin tools docs README.md RELEASE.md SKILL.md CHANGELOG.md
      - run: deno lint assets/openclaw-plugin tools
      - run: >-
          deno test --node-modules-dir=none
          --allow-read --allow-write --allow-env --allow-run
          assets/openclaw-plugin/index.test.ts

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      # Upstream Node 24 migration; pin the exact commit until the next release.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
