name: Native Moon build

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      target:
        required: true
        type: string
      run-tests:
        default: true
        type: boolean
      package:
        required: true
        type: boolean
      artifact-prefix:
        default: unsigned-release
        type: string
      retention-days:
        default: 7
        type: number

permissions:
  contents: read

jobs:
  native:
    name: ${{ inputs.target }}
    runs-on: >-
      ${{ fromJSON('{
        "aarch64-apple-darwin": "macos-15",
        "x86_64-apple-darwin": "macos-15-intel",
        "aarch64-unknown-linux-gnu": "ubuntu-24.04-arm",
        "x86_64-unknown-linux-gnu": "ubuntu-24.04"
      }')[inputs.target] }}
    # The Ubuntu 22.04 buildpack includes native build tools and keeps the glibc 2.35 baseline.
    container: ${{ endsWith(inputs.target, '-linux-gnu') && 'buildpack-deps:jammy@sha256:3dbfcff54e02773819d50726a21517583fa71c115282d26aad87f9cd22333ae1' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Verify checked-out source identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Checkout trusts the mounted worktree only inside the checkout action.
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git_status="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$git_status" ]]; then
            echo "$git_status"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: ${{ inputs.run-tests && 'clippy,rustfmt' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: moon-native-${{ inputs.target }}
          key: ${{ runner.os == 'Linux' && 'ubuntu-22.04-buildpack' || 'macos-15' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Verify native release target
        env:
          TARGET: ${{ inputs.target }}
        run: >-
          rustc -vV | grep -Fx "host: ${TARGET}"
      - if: inputs.run-tests && inputs.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - if: inputs.run-tests
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: inputs.run-tests
        run: cargo test --locked --all-targets --all-features
      - name: Exercise documented interactive-zsh strict-mode semantics
        if: inputs.run-tests && inputs.target == 'aarch64-apple-darwin'
        run: >-
          zsh -f -i -c 'source tools/interactive-zsh-smoke.zsh' 2>&1 |
          grep -Fx 'UPDATE SUCCEEDED'
      - name: Remove release artifacts restored from an older image
        if: inputs.package
        run: cargo clean --release
      - if: inputs.package
        run: cargo build --locked --release
      - name: Generate deterministic unsigned release bundle
        if: inputs.package
        env:
          MINIMUM_OS_VERSION: ${{ runner.os == 'Linux' && 'glibc-2.35' || '13.0' }}
        run: >-
          cargo run --locked --example moon-release -- bundle
          --binary target/release/moon
          --minimum-os-version "$MINIMUM_OS_VERSION"
          --database-schema-min 6
          --database-schema-max 20
          --legacy-skill-only
          --output-dir target/unsigned-release
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: inputs.package && inputs.target == 'x86_64-unknown-linux-gnu'
        with:
          deno-version: v2.x
      - name: Test the packaged Linux binary on glibc 2.35
        if: inputs.package && runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          archives=(target/unsigned-release/moon-*.tar.gz)
          test "${#archives[@]}" -eq 1
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          tar -xzf "${archives[0]}" -C "$fixture"
          binary="$fixture/moon-release/bin/moon"
          LD_BIND_NOW=1 "$binary" --home "$fixture/runtime" --json init > /dev/null
          LD_BIND_NOW=1 "$binary" --home "$fixture/runtime" --json health > /dev/null
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            sh tools/test-openclaw-adapter.sh "$binary"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.package
        with:
          name: ${{ inputs.artifact-prefix }}-${{ inputs.target }}
          path: target/unsigned-release
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
