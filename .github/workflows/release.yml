name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release {0}', inputs.tag) || format('Release checks for PR #{0}', github.event.number) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag (vX.Y.Z)
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/native-build.yml
      - .github/scripts/require-main-ci.sh

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      published_at: ${{ steps.identity.outputs.published_at }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release gate against live GitHub CI results
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tested_commit="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -F per_page=1 --jq '.workflow_runs[0].head_sha')"
          bash .github/scripts/require-main-ci.sh "$tested_commit"
          result=0
          bash .github/scripts/require-main-ci.sh "$GITHUB_SHA" || result=$?
          test "$result" -eq 1
      - id: identity
        name: Resolve validated build commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          commit="$GITHUB_SHA"
          published_at=2026-01-01T00:00:00Z
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Dispatch from main with an exact vX.Y.Z release tag.' >&2
              exit 1
            fi
            tag_ref="refs/tags/${RELEASE_TAG}"
            if [[ "$(git cat-file -t "$tag_ref")" != tag ]]; then
              echo 'Release tag must be annotated.' >&2
              exit 1
            fi
            commit="$(git rev-parse --verify "${tag_ref}^{commit}")"
            if ! git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
              echo 'Release tag must point to a commit on main.' >&2
              exit 1
            fi
            ci_url="$(bash .github/scripts/require-main-ci.sh "$commit")"
            echo "Verified main CI for ${commit}: ${ci_url}"
            tagger_date="$(git for-each-ref --format='%(taggerdate:iso-strict)' "$tag_ref")"
            published_at="$(date --utc --date="$tagger_date" '+%Y-%m-%dT%H:%M:%SZ')"
            printf 'tag=%s\ntag_object=%s\n' "$RELEASE_TAG" "$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"
            git switch --detach "$commit"
          fi
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "moon") | .version')"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$RELEASE_TAG" != "v${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Moon ${version}." >&2
            exit 1
          fi
          printf 'commit=%s\npublished_at=%s\nversion=%s\n' "$commit" "$published_at" "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    uses: ./.github/workflows/native-build.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      target: ${{ matrix.target }}
      run-tests: false
      package: true
      artifact-prefix: release-input
      retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-input-*
          path: target/release-input
          merge-multiple: false
      - name: Assemble canonical unsigned release inputs
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 target/release-publish
          cargo run --locked --example moon-release -- manifest \
            --asset target/release-input/release-input-aarch64-apple-darwin/release-asset.json \
            --asset target/release-input/release-input-x86_64-apple-darwin/release-asset.json \
            --asset target/release-input/release-input-aarch64-unknown-linux-gnu/release-asset.json \
            --asset target/release-input/release-input-x86_64-unknown-linux-gnu/release-asset.json \
            --published-at "${{ needs.validate.outputs.published_at }}" \
            --output target/release-publish/release-manifest.json
          find target/release-input -type f -name 'moon-*.tar.gz' -exec cp {} target/release-publish/ \;
          archive_count="$(find target/release-publish -maxdepth 1 -type f -name 'moon-*.tar.gz' | wc -l | tr -d ' ')"
          test "${archive_count}" = 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.validate.outputs.version }}-unsigned
          path: target/release-publish
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
          compression-level: 0

  sign-and-publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Verify the remote release tag still has the validated identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object | select(.type == "tag") | .sha')"
          test -n "$TAG_OBJECT" && test "$current" = "$TAG_OBJECT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ needs.validate.outputs.version }}-unsigned
          path: target/release-publish
      - name: Restrict release staging to the runner owner
        run: chmod 700 target/release-publish
      - name: Sign canonical manifest
        shell: bash
        env:
          MOON_RELEASE_SIGNING_KEY: ${{ secrets.MOON_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MOON_RELEASE_SIGNING_KEY}" ]]; then
            echo "production-release signing secret is unavailable" >&2
            exit 1
          fi
          printf '%s' "${MOON_RELEASE_SIGNING_KEY}" |
            cargo run --locked --example moon-release -- sign \
              --secret-key-stdin \
              --manifest target/release-publish/release-manifest.json \
              --signature-output target/release-publish/release-manifest.sig.json
      - name: Verify production signature and release identity
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          verification="$(cargo run --locked --example moon-release -- verify \
            --manifest target/release-publish/release-manifest.json \
            --signature target/release-publish/release-manifest.sig.json)"
          test "$(jq -r '.moon_version' <<< "${verification}")" = "$RELEASE_VERSION"
          test "$(jq -r '.git_commit' <<< "${verification}")" = "$RELEASE_COMMIT"
          test "$(jq -r '.verified_key_ids | join(",")' <<< "${verification}")" = "moon-release-2026-01"
      - name: Publish immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release ${RELEASE_TAG}" >&2
            exit 1
          fi
          awk -v version="$RELEASE_VERSION" '
            $1 == "##" && $2 == version { found = 1; next }
            found && $1 == "##" { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > target/release-publish/release-notes.md
          printf '\nGuides: [Getting started](https://github.com/%s/blob/%s/docs/getting-started.md) · [Upgrading and refreshing SKILL.md](https://github.com/%s/blob/%s/docs/updating.md)\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> target/release-publish/release-notes.md
          gh release create "$RELEASE_TAG" \
            target/release-publish/moon-*.tar.gz \
            target/release-publish/release-manifest.json \
            target/release-publish/release-manifest.sig.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Moon ${RELEASE_VERSION}" \
            --notes-file target/release-publish/release-notes.md \
            --generate-notes
