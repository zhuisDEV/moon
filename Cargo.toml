[package]
name = "moon"
version = "2.0.0"
edition = "2024"
description = "Local-first SQLite memory with evidence-backed learning and hybrid retrieval"
license = "MIT"
publish = false

[[bin]]
name = "moon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
regex = "1.11"
rusqlite = { version = "0.39", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-vec = "=0.1.9"
tempfile = "3.15"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
