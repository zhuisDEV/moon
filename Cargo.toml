[package]
name = "moon"
version = "1.0.5"
edition = "2024"
description = "Rust CLI for OpenClaw session lifecycle automation: archive, index, recall, and low-cost distillation."
license = "MIT"
repository = "https://github.com/coinbuidl/moon"
homepage = "https://github.com/coinbuidl/moon"
readme = "README.md"
keywords = ["openclaw", "llm", "cli", "memory", "context"]
categories = ["command-line-utilities"]
default-run = "moon"

[[bin]]
name = "moon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
json5 = "0.4"
tempfile = "3.13"
which = "7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
sha2 = "0.10"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dotenvy = "0.15"
fs2 = "0.4"
ctrlc = "3.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
